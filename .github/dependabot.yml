version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-three:
        patterns: ["three", "@types/three", "@react-three/*"]
      auth:
        patterns: ["next-auth", "@auth/*"]
      drizzle:
        patterns: ["drizzle-orm", "drizzle-kit"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
